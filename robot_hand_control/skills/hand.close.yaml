# hand.close — 灵巧手握拳
id: hand.close
name: "灵巧手握拳"
version: "1.0.0"
description: "将 O6 六通道位置设为握拳 {0×6}"
required_resources: ["hand"]
preconditions:
  - "灵巧手已连接"
execution_stages:
  - "validate"
  - "apply_preset"
success_conditions:
  - "apply_preset(Close) 返回成功"
failure_conditions:
  - "灵巧手未连接"
timeout_ms: 10000
cancellation_policy: "finish_current_command"
recovery_policy: "stop_and_report"
safety_profile:
  real_motion: true
calibration_references: []

# 技能专属数据：固定预设
preset: "close"
